<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Filmoteca</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/catalog.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">Filmoteca</a>
      <nav class="nav" data-nav aria-label="Navigare principală"></nav>
    </div>
  </header>

  <main class="container">
    <section class="page-head">
      <div>
        <h1>Catalogul de filme</h1>
        <p class="muted" data-catalog-summary></p>
      </div>
      <a class="btn btn-primary" href="/film-form.html" data-add-film hidden>Adaugă un film</a>
    </section>

    <form class="search-bar" data-search-form role="search" action="/" method="get">
      <label class="visually-hidden" for="q">Caută după titlu</label>
      <input id="q" name="q" type="search" placeholder="Caută după titlu…" maxlength="100" autocomplete="off">

      <label class="visually-hidden" for="genre">Gen</label>
      <select id="genre" name="genre">
        <option value="">Toate genurile</option>
      </select>

      <label class="visually-hidden" for="sort">Ordonează după</label>
      <select id="sort" name="sort">
        <option value="recent">Adăugate recent</option>
        <option value="rating">Nota cea mai mare</option>
        <option value="year">Anul apariției</option>
        <option value="title">Titlu (A–Z)</option>
      </select>

      <button class="btn btn-primary" type="submit">Caută</button>
    </form>

    <p class="form-error" data-page-error role="alert"></p>
    <ul class="film-grid" data-film-grid></ul>
    <nav class="pagination" data-pagination aria-label="Pagini"></nav>
  </main>
</body>
</html>
